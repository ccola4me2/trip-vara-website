<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | Trip Vara Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Products</h1><p class="sub">Sellable items and their prices, from Trip Vara Tools.</p></div>
      <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
    </header>
    <div class="content">
      <div id="err"></div>
      <section class="card" id="panel"><p class="spinner">Loading products...</p></section>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, money, showError } from '/js/app.js';
await mountShell();
const panel = document.getElementById('panel');

async function load() {
  panel.innerHTML = '<p class="spinner">Loading products...</p>';
  try {
    const d = await api('/api/catalog');
    if (d.unavailable && d.unavailable.products) {
      panel.innerHTML = '<div class="empty"><p>Products are not available with the current Trip Vara Tools permissions.</p></div>';
      return;
    }
    if (!d.products.length) {
      panel.innerHTML = '<div class="empty"><h3>No products</h3><p>Products created in Trip Vara Tools appear here.</p></div>';
      return;
    }
    panel.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Product</th><th>Type</th><th>Prices</th></tr></thead>
      <tbody>${d.products.map((p) => `<tr>
        <td><span class="name">${esc(p.name)}</span>
          ${p.description ? `<div class="muted">${esc(p.description.slice(0, 120))}</div>` : ''}</td>
        <td><span class="badge badge-navy">${esc(p.productType || 'product')}</span></td>
        <td>${p.prices.length
            ? p.prices.map((pr) => `<div>${money(pr.amountCents)}
                <span class="muted">${esc([pr.name, pr.type].filter(Boolean).join(' · '))}</span></div>`).join('')
            : '<span class="muted">no price set</span>'}</td>
      </tr>`).join('')}</tbody></table></div>`;
  } catch (err) { showError(document.getElementById('err'), err); panel.innerHTML = ''; }
}
document.getElementById('refresh').addEventListener('click', load);
await load();
</script>
</body></html>
