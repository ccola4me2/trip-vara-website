<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fill in the gaps | Trip Vara Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Fill in the gaps</h1><p class="sub">Reservations missing the numbers and dates everything else depends on.</p></div>
      <a class="btn btn-ghost btn-sm" href="/app/reservations">All reservations</a>
    </header>
    <div class="content">
      <div id="err"></div>
      <section id="stats" class="stat-grid"></section>
      <div class="notice notice-info">
        A trip with no final payment date cannot be chased, and one with no cost cannot be counted.
        Type straight into the table: each change saves when you leave the box.
      </div>
      <div class="toolbar">
        <select id="filter" aria-label="What to show" style="width:auto;">
          <option value="any">Missing anything</option>
          <option value="date">Missing a final payment date</option>
          <option value="money">Missing the trip cost</option>
          <option value="commission">Missing commission</option>
        </select>
        <span id="saved" class="muted"></span>
      </div>
      <section class="card" id="panel"><p class="spinner">Loading...</p></section>
    </div>
  </div>
</div>

<script type="module">
import { api, mountShell, esc, money, dateFmt, showError } from '/js/app.js';
const ME = (await mountShell()).id;

const panel = document.getElementById('panel');
const err = document.getElementById('err');
const filter = document.getElementById('filter');
const savedNote = document.getElementById('saved');
let all = [];

const missing = (b) => ({
  date: !b.final_payment_due,
  money: !b.gross_cents,
  commission: !b.commission_cents,
});
const needsSomething = (b) => {
  const m = missing(b);
  return m.date || m.money || m.commission;
};

function note(text, bad) {
  savedNote.textContent = text;
  savedNote.style.color = bad ? 'var(--red-600)' : 'var(--green-600)';
  clearTimeout(note.timer);
  note.timer = setTimeout(() => { savedNote.textContent = ''; }, 2500);
}

function render() {
  const mine = all.filter((b) => b.user_id === ME && b.status !== 'cancelled');
  const rows = mine.filter((b) => {
    const m = missing(b);
    if (filter.value === 'date') return m.date;
    if (filter.value === 'money') return m.money;
    if (filter.value === 'commission') return m.commission;
    return needsSomething(b);
  });

  const counts = {
    date: mine.filter((b) => missing(b).date).length,
    money: mine.filter((b) => missing(b).money).length,
    commission: mine.filter((b) => missing(b).commission).length,
  };
  document.getElementById('stats').innerHTML = `
    <div class="stat"><p class="label">No final payment date</p>
      <p class="value" style="${counts.date ? 'color:var(--red-600);' : ''}">${counts.date}</p>
      <p class="meta">Nothing can warn you about these</p></div>
    <div class="stat"><p class="label">No trip cost</p><p class="value">${counts.money}</p>
      <p class="meta">Missing from every total</p></div>
    <div class="stat"><p class="label">No commission</p><p class="value">${counts.commission}</p>
      <p class="meta">Missing from what you are owed</p></div>
    <div class="stat"><p class="label">Complete</p>
      <p class="value">${mine.length - mine.filter(needsSomething).length}</p>
      <p class="meta">of ${mine.length} reservations</p></div>`;

  if (!rows.length) {
    panel.innerHTML = `<div class="empty"><h3>Nothing missing</h3>
      <p>Every reservation has its cost, commission and vendor deadline.</p></div>`;
    return;
  }

  panel.innerHTML = `<div class="table-wrap"><table class="grid">
    <thead><tr><th>Client</th><th>Vendor</th><th>Departing</th><th>Returning</th>
      <th>Final payment</th><th class="num">Trip cost</th><th class="num">Commission</th></tr></thead>
    <tbody>${rows.map((b) => `<tr data-id="${esc(b.id)}">
      <td><a class="name" href="/app/reservation?id=${esc(b.id)}">${esc(b.client_name)}</a>
        <div class="muted">${esc(b.confirmation_number || '')}</div></td>
      <td>${esc(b.supplier || '-')}<div class="muted">${esc(b.product_name || '')}</div></td>
      <td><input type="date" data-field="departDate" value="${esc(b.depart_date || '')}"></td>
      <td><input type="date" data-field="returnDate" value="${esc(b.return_date || '')}"></td>
      <td><input type="date" data-field="finalPaymentDue" value="${esc(b.final_payment_due || '')}"
            class="${b.final_payment_due ? '' : 'wanted'}"></td>
      <td class="num"><input inputmode="decimal" data-field="gross" placeholder="0.00"
            value="${b.gross_cents ? (b.gross_cents / 100).toFixed(2) : ''}"
            class="${b.gross_cents ? '' : 'wanted'}"></td>
      <td class="num"><input inputmode="decimal" data-field="commission" placeholder="0.00"
            value="${b.commission_cents ? (b.commission_cents / 100).toFixed(2) : ''}"
            class="${b.commission_cents ? '' : 'wanted'}"></td>
    </tr>`).join('')}</tbody></table></div>`;

  panel.querySelectorAll('[data-field]').forEach((input) => {
    let original = input.value;
    // 'change' rather than 'blur': it is the browser's own "this value is
    // committed" signal, it fires for a date picker without the field ever
    // being blurred, and it does not fire for tabbing through a field you did
    // not touch.
    input.addEventListener('change', async () => {
      if (input.value === original) return;
      const id = input.closest('tr').dataset.id;
      input.disabled = true;
      try {
        const res = await api(`/api/bookings/${encodeURIComponent(id)}/quick`,
          { method: 'POST', body: { [input.dataset.field]: input.value } });
        const i = all.findIndex((b) => b.id === id);
        if (i >= 0) all[i] = res.booking;
        input.classList.remove('wanted');
        original = input.value;
        note('Saved');
        err.innerHTML = '';
        // Redrawn so the counts above follow, and so a row that is now
        // complete leaves the list it is no longer part of.
        render();
      } catch (e) {
        input.value = original;
        note('Not saved', true);
        showError(err, e);
      } finally { input.disabled = false; }
    });
    // Enter commits rather than submitting anything, because this is a grid.
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      input.blur();
    });
  });
}

filter.addEventListener('change', render);

try {
  const d = await api('/api/bookings');
  all = d.bookings;
  render();
} catch (e) { showError(panel, e); }
</script>
</body></html>
