<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms | Trip Vara Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Forms</h1><p class="sub">Submissions from your CRM forms.</p></div>
      <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
    </header>
    <div class="content">
      <div class="toolbar">
        <select id="form-filter" aria-label="Form"><option value="">All forms</option></select>
        <input id="search" type="search" placeholder="Search name or email" style="min-width:220px;">
        <span class="muted" id="count"></span>
      </div>
      <section class="card" id="panel"><p class="spinner">Loading submissions...</p></section>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, timeAgo, showError } from '/js/app.js';
await mountShell();

const panel = document.getElementById('panel');
const filter = document.getElementById('form-filter');
const search = document.getElementById('search');
const countEl = document.getElementById('count');
let formsLoaded = false;

function render(d) {
  if (!formsLoaded && d.forms.length) {
    filter.innerHTML = '<option value="">All forms</option>' +
      d.forms.map((f) => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');
    formsLoaded = true;
  }
  countEl.textContent = d.submissions.length
    ? `${d.submissions.length} shown${d.total > d.submissions.length ? ` of ${d.total}` : ''}`
    : '';

  if (!d.submissions.length) {
    panel.innerHTML = d.forms.length
      ? '<div class="empty"><h3>No submissions</h3><p>Nothing has come through these forms yet.</p></div>'
      : '<div class="empty"><h3>No forms</h3><p>Build a form in your CRM and its submissions land here.</p></div>';
    return;
  }

  panel.innerHTML = `<ul class="timeline">${d.submissions.map((s) => `
    <li>
      <div class="row-between" style="align-items:flex-start;">
        <div>
          <span class="name">${esc(s.name || s.email || 'Anonymous')}</span>
          ${s.formName ? `<span class="badge badge-navy" style="margin-left:.4rem;">${esc(s.formName)}</span>` : ''}
          <div class="muted">${esc([s.email, s.phone].filter(Boolean).join('  ·  '))}</div>
        </div>
        <div style="text-align:right;">
          <div class="when">${esc(s.createdAt ? timeAgo(s.createdAt) : '')}</div>
          ${s.contactId ? `<a class="btn btn-ghost btn-sm" style="margin-top:.35rem;"
             href="/app/contact?id=${encodeURIComponent(s.contactId)}">Open contact</a>` : ''}
        </div>
      </div>
      ${s.answers.length ? `<dl class="kv" style="margin-top:.7rem;">${s.answers.slice(0, 8).map((a) =>
        `<dt>${esc(a.label)}</dt><dd>${esc(a.value)}</dd>`).join('')}</dl>` : ''}
    </li>`).join('')}</ul>`;
}

async function load() {
  panel.innerHTML = '<p class="spinner">Loading submissions...</p>';
  try {
    const params = new URLSearchParams();
    if (filter.value) params.set('formId', filter.value);
    if (search.value.trim()) params.set('q', search.value.trim());
    render(await api(`/api/forms${params.toString() ? '?' + params : ''}`));
  } catch (err) { countEl.textContent = ''; showError(panel, err); }
}

let timer;
search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 350); });
filter.addEventListener('change', load);
document.getElementById('refresh').addEventListener('click', load);
await load();
</script>
</body></html>
