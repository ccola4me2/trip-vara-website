<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Trip Vara Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Dashboard</h1><p class="sub" id="greeting">Loading...</p></div>
      <div class="toolbar" style="margin:0;">
        <span id="scope"></span>
        <button class="btn btn-ghost btn-sm" type="button" id="customise">Customise</button>
        <a class="btn btn-primary btn-sm" href="/app/reservations?new=1">New reservation</a>
      </div>
    </header>
    <div class="content">
      <section id="stats" class="stat-grid"></section>
      <section id="ghl-state"></section>
      <section class="card customiser" id="customiser" hidden>
        <div class="card-head"><h2>Your dashboard</h2>
          <div class="toolbar" style="margin:0;">
            <button class="btn btn-ghost btn-sm" type="button" id="reset-layout">Reset to default</button>
            <button class="btn btn-primary btn-sm" type="button" id="done-customising">Done</button>
          </div></div>
        <div class="card-pad">
          <p class="field-hint" style="margin:0 0 .9rem;">Drag a panel to move it. Untick one to take it off
            your dashboard. Changes save as you make them, and follow you to any device you sign in on.</p>
          <ul class="panel-list" id="panel-list"></ul>
          <div id="links-editor"></div>
        </div>
      </section>
      <section class="widgets" id="widgets"></section>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, money, dateFmt, timeAgo, daysUntil, showError,
         mountScopePicker, advisorParam } from '/js/app.js';
await mountShell();

const widgetsEl = document.getElementById('widgets');
let d = null;
let layout = { widgets: [], links: [] };

const fmtShort = (iso) => (iso ? dateFmt(iso).replace(/,? \d{4}$/, '') : '-');

/** A panel with its own tab strip. Tabs render lazily from a map of builders. */
function widget(title, link, tabs, initial) {
  const id = `w${Math.random().toString(36).slice(2, 8)}`;
  const el = document.createElement('section');
  el.className = 'widget';
  el.innerHTML = `
    <header><h2>${esc(title)}</h2>${link ? `<a href="${esc(link.href)}">${esc(link.label)}</a>` : ''}</header>
    ${tabs.length > 1 ? `<div class="wtabs">${tabs.map((t) => `
      <button class="wtab" type="button" data-tab="${esc(t.key)}"
        aria-selected="${t.key === initial}">${esc(t.label)}</button>`).join('')}</div>` : ''}
    <div class="wbody" id="${id}"></div>`;

  const body = el.querySelector(`#${id}`);
  const draw = (key) => {
    const tab = tabs.find((t) => t.key === key) || tabs[0];
    body.innerHTML = tab.render() || '<p class="wempty">Nothing here yet.</p>';
  };
  el.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
    el.querySelectorAll('[data-tab]').forEach((x) =>
      x.setAttribute('aria-selected', String(x.dataset.tab === b.dataset.tab)));
    draw(b.dataset.tab);
  }));
  draw(initial);
  return el;
}

function reservationTable(rows, cols) {
  if (!rows.length) return '';
  return `<div class="table-wrap"><table><thead><tr>${
    cols.map((c) => `<th${c.num ? ' class="num"' : ''}>${esc(c.label)}</th>`).join('')
  }</tr></thead><tbody>${rows.map((r) => `<tr>${
    cols.map((c) => `<td${c.num ? ' class="num"' : ''}>${c.cell(r)}</td>`).join('')
  }</tr></tbody>`).join('')}</tbody></table></div>`;
}

function paymentRows(list) {
  if (!list.length) return '';
  return `<div class="table-wrap"><table>
    <thead><tr><th>Due</th><th>Details</th><th class="num">Amount</th></tr></thead>
    <tbody>${list.map((p) => {
      const left = daysUntil(p.due_date);
      const hard = p.payment_class === 'hard';
      const tone = left === null ? 'badge-navy'
        : left < 0 ? 'badge-red'
        : hard && left <= 14 ? 'badge-red'
        : left <= 14 ? 'badge-amber' : 'badge-navy';
      const label = left === null ? ''
        : left < 0 ? (hard ? 'past due' : 'reminder passed')
        : hard ? `cancels in ${left}d` : `remind in ${left}d`;
      return `<tr>
        <td>${esc(fmtShort(p.due_date))}<div><span class="badge ${tone}">${esc(label)}</span></div></td>
        <td><span class="name">${esc(p.client_name)}</span>
          <div class="muted">${esc([p.supplier, p.product_name].filter(Boolean).join(' · '))}</div></td>
        <td class="num">${money(p.amount_cents)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function build() {
  const s = d.stats;
  const everyone = Boolean(d.scope && d.scope.all);
  const p = d.payStats;

  document.getElementById('greeting').textContent = `${d.user.name}, here is where things stand.`;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><p class="label">Cancels within 14 days</p>
      <p class="value" style="${p.hardDueCents ? 'color:var(--red-600);' : ''}">${money(p.hardDueCents)}</p>
      <p class="meta">${p.hardCount} vendor deadline${p.hardCount === 1 ? '' : 's'}</p></div>
    <div class="stat"><p class="label">Reminders next 14 days</p><p class="value">${money(p.softDueCents)}</p>
      <p class="meta">${p.softCount} to chase before the deadline</p></div>
    <div class="stat"><p class="label">Active reservations</p><p class="value">${s.booked}</p>
      <p class="meta">${s.quoted} quoted, ${s.travelled} travelled</p></div>
    <div class="stat"><p class="label">${everyone ? 'Agency earnings' : 'Your earnings'}</p>
      <p class="value">${money(s.commissionCents)}</p>
      <p class="meta">${money(s.commissionPaidCents)} paid out</p></div>`;

  if (d.ghlStatus === 'not_configured') showError(document.getElementById('ghl-state'), { code: 'not_configured' });
  else if (d.ghlStatus === 'error') document.getElementById('ghl-state').innerHTML =
    '<div class="notice notice-error">Could not reach Trip Vara Tools just now. Reservation figures above are still accurate.</div>';

  drawPanels();
}

// Module scope, because the panel builders below run outside build().
const byClass = (cls) => d.upcomingPayments.filter((x) =>
  cls === 'past' ? x.due_date < d.today : (x.payment_class === cls && x.due_date >= d.today));

// --------------------------------------------------------------- panels ---
// One builder per panel id. The server holds the same list of ids and drops
// anything it does not recognise, so a panel exists in exactly two places
// rather than being spelled out again in the layout, the picker and the page.
const PANELS = {
  notices: () => widget('Notices', null, [
    { key: 'all', label: 'All', render: () => d.notices.length
      ? `<ul class="notice-list">${d.notices.map((n) => `<li class="tone-${esc(n.tone)}">
          <div class="t">${esc(n.title)}</div>
          <div class="m">${esc(n.detail)}</div>
          <a href="${esc(n.href)}">${esc(n.label)}</a></li>`).join('')}</ul>`
      : '<p class="wempty">Nothing needs you right now.</p>' },
  ], 'all'),

  tasks: () => widget('To do', { href: '/app/tasks', label: 'All tasks' }, [
    { key: 'due', label: 'Due', render: () => taskRows(openTasks().filter((t) => t.due_date && t.due_date <= d.today)) },
    { key: 'soon', label: 'Coming up', render: () => taskRows(openTasks().filter((t) => t.due_date && t.due_date > d.today)) },
    { key: 'someday', label: 'No date', render: () => taskRows(openTasks().filter((t) => !t.due_date)) },
  ], 'due'),

  deadlines: () => widget('Deadlines', { href: '/app/payments', label: 'All payments' }, [
    { key: 'soft', label: 'Reminders', render: () => paymentRows(byClass('soft')) },
    { key: 'hard', label: 'Vendor dates', render: () => paymentRows(byClass('hard')) },
    { key: 'past', label: 'Overdue', render: () => paymentRows(byClass('past')) },
  ], 'soft'),

  bookings: () => widget('Latest bookings', { href: '/app/reservations', label: 'All reservations' }, [
    { key: 'added', label: 'Newest', render: () => reservationTable(d.reservations.added, RES_COLS) },
    { key: 'modified', label: 'Recently changed', render: () => reservationTable(d.reservations.modified, RES_COLS) },
  ], 'added'),

  travelling: () => widget("Who's travelling", null, [
    { key: 'upcoming', label: 'Leaving soon', render: () => reservationTable(d.current.upcoming, CUR_COLS) },
    { key: 'traveling', label: 'Away now', render: () => reservationTable(d.current.traveling, CUR_COLS) },
    { key: 'returned', label: 'Just back', render: () => reservationTable(d.current.returned, CUR_COLS) },
  ], 'upcoming'),

  groups: () => widget('Group space', { href: '/app/groups', label: 'All groups' }, [
    { key: 'upcoming', label: 'Open blocks', render: () => {
      const rows = d.groups || [];
      if (!rows.length) return '<p class="wempty">No group space open.</p>';
      return `<div class="table-wrap"><table>
        <thead><tr><th>Vendor</th><th>Departing</th><th>Number / name</th><th class="num">Left</th></tr></thead>
        <tbody>${rows.map((g) => {
          const left = Math.max(0, (g.cabins_held || 0) - (g.cabins_sold || 0));
          const days = daysUntil(g.option_date);
          return `<tr>
            <td>${esc(g.vendor || '-')}</td>
            <td>${esc(fmtShort(g.depart_date))}</td>
            <td><span class="name">${esc([g.group_code, g.name].filter(Boolean).join(' / '))}</span>
              ${left > 0 && days !== null && days <= 45
                ? `<div><span class="badge ${days < 0 ? 'badge-red' : days <= 14 ? 'badge-red' : 'badge-amber'}">${
                    days < 0 ? 'space released' : `releases in ${days}d`}</span></div>` : ''}</td>
            <td class="num">${left}</td></tr>`;
        }).join('')}</tbody></table></div>`;
    } },
  ], 'upcoming'),

  deals: () => widget('Deals in play', { href: '/app/pipeline', label: 'Pipeline' }, [
    { key: 'closed', label: 'Closed', render: () => {
      const c = d.pipeline && d.pipeline.closed;
      if (!c) return '<p class="wempty">Pipeline unavailable.</p>';
      if (!c.won && !c.lost && !c.abandoned) return '<p class="wempty">Nothing closed in the last year.</p>';
      return `<div style="padding:.9rem 1rem;">
        <p style="font-size:.82rem;margin:0 0 .7rem;">Closing rate
          <strong style="font-size:1.4rem;">${c.closingRate === null ? '-' : c.closingRate + '%'}</strong>
          <span class="muted">won against won plus lost, last 12 months</span></p>
        <div class="stage-row"><span style="min-width:6rem;">Won</span>
          <span class="n">${c.won} &middot; ${esc(money(c.wonValue * 100))}</span></div>
        <div class="stage-row"><span style="min-width:6rem;">Lost</span><span class="n">${c.lost}</span></div>
        <div class="stage-row"><span style="min-width:6rem;">Went quiet</span>
          <span class="n">${c.abandoned}<span class="muted"> (not counted in the rate)</span></span></div>
      </div>`;
    } },
    { key: 'active', label: 'Open', render: () => {
      if (!d.pipeline) return '<p class="wempty">Pipeline unavailable.</p>';
      if (!d.pipeline.openCount) return '<p class="wempty">No open opportunities.</p>';
      const total = d.pipeline.openCount;
      return `<p style="padding:.7rem 1rem 0;font-size:.82rem;">Total open:
          <strong>${total}</strong> &middot; ${money(d.pipeline.openValue * 100)}</p>
        ${d.pipeline.stages.map((st) => `<div class="stage-row">
          <span style="min-width:8rem;">${esc(st.name)}</span>
          <span class="bar"><span style="width:${Math.round((st.count / total) * 100)}%"></span></span>
          <span class="n">${st.count} · ${Math.round((st.count / total) * 100)}%</span></div>`).join('')}`;
    } },
  ], 'active'),

  trend: () => widget('Production trend', { href: '/app/reports', label: 'Full report' }, [
    { key: 'gross', label: 'By month', render: () => trendBars('gross_cents') },
    { key: 'type', label: 'By type', render: () => breakdown(d.byType, TYPE_LABEL) },
    { key: 'vendor', label: 'By vendor', render: () => breakdown(d.byVendor) },
  ], 'gross'),

  links: () => widget('Quick links', null, [
    { key: 'all', label: 'All', render: () => layout.links.length
      ? `<ul class="rows">${layout.links.map((l) => `<li>
          <a class="t" style="font-size:.85rem;" href="${esc(l.href)}"
             target="_blank" rel="noopener noreferrer">${esc(l.label)}</a></li>`).join('')}</ul>`
      : '<p class="wempty">Add your own shortcuts under Customise.</p>' },
  ], 'all'),

  activity: () => widget('Activity', null, [
    { key: 'all', label: 'All', render: () => d.activity.length
      ? `<ul class="rows">${d.activity.map((a) => `<li>
          <div class="t" style="font-size:.82rem;">${esc(a.subject || a.kind)}</div>
          <div class="m">${esc(timeAgo(a.created_at))}${a.advisor_name && everyoneNow()
            ? ' · ' + esc(a.advisor_name) : ''}</div></li>`).join('')}</ul>`
      : '' },
  ], 'all'),
};

const everyoneNow = () => Boolean(d.scope && d.scope.all);
const openTasks = () => (d.tasks || []).filter((t) => !t.done_at);

/**
 * Tasks tick off in place. Going to another screen and back to record that you
 * rang somebody is how a task list stops being used by the second week.
 */
function taskRows(list) {
  if (!list.length) return '';
  return `<ul class="rows task-rows">${list.map((t) => {
    const late = t.due_date && t.due_date < d.today;
    return `<li>
      <label class="task-tick">
        <input type="checkbox" data-task="${esc(t.id)}">
        <span>
          <span class="t" style="font-size:.84rem;">${esc(t.title)}</span>
          <span class="m">${[
            t.due_date ? `<span class="${late ? 'late' : ''}">${esc(fmtShort(t.due_date))}</span>` : 'no date',
            t.priority === 'high' ? '<span class="badge badge-coral">high</span>' : '',
            t.booking_client ? esc(t.booking_client) : '',
            everyoneNow() && t.advisor_name ? esc(t.advisor_name) : '',
          ].filter(Boolean).join(' &middot; ')}</span>
        </span>
      </label></li>`;
  }).join('')}</ul>`;
}

const TYPE_LABEL = {
  cruise: 'Cruise', hotel: 'Hotel', resort: 'Resort', package: 'Package', tour: 'Tour',
  air: 'Air', rail: 'Rail', car: 'Car hire', transfer: 'Transfer', excursion: 'Excursion',
  attraction: 'Attraction', event_ticket: 'Event ticket', insurance: 'Travel insurance',
  parking: 'Parking', visa_passport: 'Visa or passport', other: 'Other',
};

/** A ranked bar list. Reads better than a pie for fifteen categories. */
function breakdown(rows, labels) {
  if (!rows || !rows.length) return '<p class="wempty">Nothing booked ahead yet.</p>';
  const top = Math.max(...rows.map((r) => r.gross_cents || 0), 1);
  return `<div style="padding:.4rem 0 .6rem;">${rows.map((r) => `
    <div class="stage-row">
      <span style="min-width:8.5rem;">${esc((labels && labels[r.label]) || r.label)}</span>
      <span class="bar"><span style="width:${Math.round(((r.gross_cents || 0) / top) * 100)}%"></span></span>
      <span class="n">${esc(money(r.gross_cents))}</span>
    </div>`).join('')}</div>`;
}

function trendBars(field) {
  const rows = d.trend || [];
  if (!rows.length) return '<p class="wempty">No booked departures yet.</p>';
  const max = Math.max(...rows.map((m) => m[field] || 0), 1);
  return `<div class="trend">${rows.map((m) => `
    <div class="trend-col" title="${esc(m.month)}: ${esc(money(m[field]))}">
      <span class="trend-bar" style="height:${Math.max(Math.round(((m[field] || 0) / max) * 96), 2)}px"></span>
      <span class="trend-label">${esc((m.month || '').slice(5))}</span>
    </div>`).join('')}</div>
    <p class="trend-foot">${esc(money(rows.reduce((n, m) => n + (m[field] || 0), 0)))} over
      ${rows.length} month${rows.length === 1 ? '' : 's'}</p>`;
}

function drawPanels() {
  const visible = layout.widgets.filter((w) => !w.hidden && PANELS[w.id]);
  widgetsEl.replaceChildren(...visible.map((w) => {
    const el = PANELS[w.id]();
    el.dataset.panel = w.id;
    return el;
  }));
  // Delegated, because a widget redraws its body whenever a tab is clicked and
  // per checkbox listeners would be lost the first time that happened.
  widgetsEl.querySelectorAll('[data-panel="tasks"]').forEach((panel) => {
    panel.addEventListener('change', async (e) => {
      const box = e.target.closest('[data-task]');
      if (!box) return;
      box.disabled = true;
      try {
        await api(`/api/tasks/${encodeURIComponent(box.dataset.task)}`,
          { method: 'PUT', body: { done: box.checked } });
        const t = (d.tasks || []).find((x) => x.id === box.dataset.task);
        if (t) t.done_at = box.checked ? Math.floor(Date.now() / 1000) : null;
        drawPanels();
      } catch {
        box.checked = !box.checked;
        box.disabled = false;
      }
    });
  });
  if (!visible.length) {
    widgetsEl.innerHTML = `<div class="empty" style="grid-column:1/-1;">
      <h3>Every panel is switched off</h3><p>Open Customise to put some back.</p></div>`;
  }
}

const RES_COLS = [
  { label: 'Added', cell: (r) => `<span class="muted">${esc(timeAgo(r.created_at))}</span>` },
  { label: 'Vendor', cell: (r) => esc(r.supplier || '-') },
  { label: 'Departing', cell: (r) => esc(fmtShort(r.depart_date)) },
  { label: 'Client', cell: (r) => `<span class="name">${esc(r.client_name)}</span>` },
  { label: 'Conf #', cell: (r) => `<span class="muted">${esc(r.confirmation_number || '-')}</span>` },
];
const CUR_COLS = [
  { label: 'Vendor', cell: (r) => esc(r.supplier || '-') },
  { label: 'Departing', cell: (r) => esc(fmtShort(r.depart_date)) },
  { label: 'Returning', cell: (r) => esc(fmtShort(r.return_date)) },
  { label: 'Client', cell: (r) => `<span class="name">${esc(r.client_name)}</span>` },
  { label: 'Conf #', cell: (r) => `<span class="muted">${esc(r.confirmation_number || '-')}</span>` },
];

// ----------------------------------------------------------- customiser ---
// Reordering is drag and drop with a keyboard equivalent beside it. Drag alone
// would make the dashboard unarrangeable for anyone not using a mouse, and the
// arrows cost four lines.
function drawCustomiser() {
  const list = document.getElementById('panel-list');
  const byId = Object.fromEntries((d.panels || []).map((p) => [p.id, p]));

  list.innerHTML = layout.widgets.map((w, i) => {
    const meta = byId[w.id] || { title: w.id, hint: '' };
    return `<li draggable="true" data-id="${esc(w.id)}" data-index="${i}">
      <span class="grip" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/>
          <circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/>
          <circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
      <label class="panel-name">
        <input type="checkbox" data-toggle="${esc(w.id)}"${w.hidden ? '' : ' checked'}>
        <span><b>${esc(meta.title)}</b><small>${esc(meta.hint || '')}</small></span>
      </label>
      <span class="move">
        <button type="button" data-move="up" data-id="${esc(w.id)}" aria-label="Move ${esc(meta.title)} up"
          ${i === 0 ? 'disabled' : ''}>&uarr;</button>
        <button type="button" data-move="down" data-id="${esc(w.id)}" aria-label="Move ${esc(meta.title)} down"
          ${i === layout.widgets.length - 1 ? 'disabled' : ''}>&darr;</button>
      </span>
    </li>`;
  }).join('');

  list.querySelectorAll('[data-toggle]').forEach((box) => {
    box.addEventListener('change', () => {
      const w = layout.widgets.find((x) => x.id === box.dataset.toggle);
      if (w) w.hidden = !box.checked;
      saveLayout();
    });
  });

  list.querySelectorAll('[data-move]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const from = layout.widgets.findIndex((x) => x.id === btn.dataset.id);
      const to = btn.dataset.move === 'up' ? from - 1 : from + 1;
      if (from < 0 || to < 0 || to >= layout.widgets.length) return;
      const [moved] = layout.widgets.splice(from, 1);
      layout.widgets.splice(to, 0, moved);
      saveLayout();
      drawCustomiser();
      // Keep the keyboard on the button that just moved, or arrowing a panel
      // down the list means finding it again after every single step.
      list.querySelector(`[data-move="${btn.dataset.move}"][data-id="${btn.dataset.id}"]`)?.focus();
    });
  });

  let dragging = null;
  list.querySelectorAll('li').forEach((li) => {
    li.addEventListener('dragstart', (e) => {
      dragging = li.dataset.id;
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      // Firefox will not start a drag without something on the transfer.
      e.dataTransfer.setData('text/plain', li.dataset.id);
    });
    li.addEventListener('dragend', () => { li.classList.remove('dragging'); dragging = null; });
    li.addEventListener('dragover', (e) => {
      if (!dragging || dragging === li.dataset.id) return;
      e.preventDefault();
      li.classList.add('drop-target');
    });
    li.addEventListener('dragleave', () => li.classList.remove('drop-target'));
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      li.classList.remove('drop-target');
      if (!dragging || dragging === li.dataset.id) return;
      const from = layout.widgets.findIndex((x) => x.id === dragging);
      const to = layout.widgets.findIndex((x) => x.id === li.dataset.id);
      if (from < 0 || to < 0) return;
      const [moved] = layout.widgets.splice(from, 1);
      layout.widgets.splice(to, 0, moved);
      saveLayout();
      drawCustomiser();
    });
  });

  drawLinksEditor();
}

function drawLinksEditor() {
  const host = document.getElementById('links-editor');
  host.innerHTML = `<h3 style="font-size:.85rem;margin:1.4rem 0 .5rem;">Quick links</h3>
    <p class="field-hint" style="margin:0 0 .7rem;">Shortcuts to whatever you open every day: a vendor's
      booking engine, a shared drive, a supplier portal. They appear in the Quick links panel.</p>
    <ul class="rows" id="link-rows">${layout.links.map((l, i) => `<li>
      <div class="row-between">
        <span><span class="t" style="font-size:.85rem;">${esc(l.label)}</span>
          <span class="m">${esc(l.href)}</span></span>
        <button class="btn btn-ghost btn-sm" type="button" data-drop-link="${i}">Remove</button>
      </div></li>`).join('')}</ul>
    <div class="field-row" style="margin-top:.7rem;">
      <div class="field" style="margin:0;"><label for="link-label">Name</label>
        <input id="link-label" maxlength="40" placeholder="Vendor portal"></div>
      <div class="field" style="margin:0;"><label for="link-href">Address</label>
        <input id="link-href" type="url" placeholder="https://..."></div>
    </div>
    <p class="field-hint" id="link-error" style="color:var(--red-600);" hidden></p>
    <button class="btn btn-secondary btn-sm" type="button" id="add-link" style="margin-top:.6rem;">Add link</button>`;

  host.querySelectorAll('[data-drop-link]').forEach((btn) => {
    btn.addEventListener('click', () => {
      layout.links.splice(Number(btn.dataset.dropLink), 1);
      saveLayout();
      drawLinksEditor();
      drawPanels();
    });
  });

  host.querySelector('#add-link').addEventListener('click', () => {
    const label = host.querySelector('#link-label').value.trim();
    const href = host.querySelector('#link-href').value.trim();
    const error = host.querySelector('#link-error');
    // The same rule the server enforces, said here so it is a message rather
    // than a link that silently disappears on save.
    if (!label || !/^https?:\/\//i.test(href)) {
      error.textContent = 'Give it a name and a web address starting with http:// or https://.';
      error.hidden = false;
      return;
    }
    error.hidden = true;
    layout.links.push({ label, href });
    saveLayout();
    drawLinksEditor();
    drawPanels();
  });
}

/**
 * Saves in the background and redraws immediately.
 *
 * A dashboard that waits on the network before it moves a panel feels broken,
 * and the cost of being wrong is one panel in the wrong order until a reload.
 * A failure says so rather than leaving you thinking it saved.
 */
let saveTimer = null;
function saveLayout() {
  drawPanels();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const res = await api('/api/prefs/dashboard', { method: 'PUT', body: { layout } });
      layout = res.layout;
    } catch {
      const box = document.getElementById('ghl-state');
      box.innerHTML = '<div class="notice notice-error">Could not save your dashboard layout. '
        + 'It will look right until you reload.</div>';
    }
  }, 300);
}

const customiser = document.getElementById('customiser');
document.getElementById('customise').addEventListener('click', () => {
  customiser.hidden = !customiser.hidden;
  if (!customiser.hidden) { drawCustomiser(); customiser.scrollIntoView({ block: 'nearest' }); }
});
document.getElementById('done-customising').addEventListener('click', () => { customiser.hidden = true; });
document.getElementById('reset-layout').addEventListener('click', async () => {
  const res = await api('/api/prefs/dashboard', { method: 'DELETE' });
  layout = res.layout;
  drawCustomiser();
  drawPanels();
});

try {
  d = await api(`/api/dashboard${advisorParam() ? '?' + advisorParam() : ''}`);
  layout = d.layout;
  mountScopePicker(document.getElementById('scope'), d, () => location.reload());
  build();
}
catch (err) { showError(document.getElementById('ghl-state'), err); }
</script>
</body></html>
