<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing | Trip Vara Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Marketing</h1><p class="sub">Funnels, campaigns, email templates, links, social and blog, from Trip Vara Tools.</p></div>
      <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
    </header>
    <div class="content">
      <div id="err"></div>
      <div class="tabs" id="tabs"></div>
      <section class="card" id="panel"><p class="spinner">Loading...</p></section>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, timeAgo, showError } from '/js/app.js';
await mountShell();

const tabsEl = document.getElementById('tabs');
const panel = document.getElementById('panel');
let data = null;
let active = 'funnels';

const TABS = [
  { key: 'funnels', label: 'Funnels' },
  { key: 'campaigns', label: 'Campaigns' },
  { key: 'emailTemplates', label: 'Email templates' },
  { key: 'triggerLinks', label: 'Trigger links' },
  { key: 'socialAccounts', label: 'Social accounts' },
  { key: 'socialPosts', label: 'Social posts' },
  { key: 'blogPosts', label: 'Blog posts' },
];

const ROW = {
  funnels: (f) => [f.name, [f.type, f.url].filter(Boolean).join('  ·  '), f.updatedAt],
  campaigns: (c) => [c.name, c.status, c.createdAt],
  emailTemplates: (t) => [t.name, t.type, t.updatedAt],
  triggerLinks: (l) => [l.name, l.redirectTo, null],
  socialAccounts: (a) => [a.name, a.platform, null],
  socialPosts: (p) => [p.summary || '(no text)', p.status, p.publishedAt || p.createdAt],
  blogPosts: (b) => [b.title, b.status, b.publishedAt],
};

function renderTabs() {
  tabsEl.innerHTML = TABS.map((t) => {
    const n = (data && Array.isArray(data[t.key])) ? data[t.key].length : 0;
    const off = data && data.unavailable && data.unavailable[t.key];
    return `<button class="tab" type="button" role="tab" data-key="${t.key}"
      aria-selected="${t.key === active}">${esc(t.label)}<span class="n">${off ? '—' : n}</span></button>`;
  }).join('');
  tabsEl.querySelectorAll('[data-key]').forEach((b) =>
    b.addEventListener('click', () => { active = b.dataset.key; renderTabs(); renderPanel(); }));
}

function renderPanel() {
  const off = data.unavailable && data.unavailable[active];
  const items = Array.isArray(data[active]) ? data[active] : [];
  if (off) {
    panel.innerHTML = '<div class="empty"><p>This area is not available with the current Trip Vara Tools permissions.</p></div>';
    return;
  }
  if (!items.length) {
    panel.innerHTML = '<div class="empty"><h3>Nothing here yet</h3><p>Anything created in Trip Vara Tools shows up on this tab.</p></div>';
    return;
  }
  panel.innerHTML = `<ul class="rows">${items.map((it) => {
    const [title, meta, when] = ROW[active](it);
    return `<li><div class="row-between">
      <div style="min-width:0;"><div class="t">${esc(title || 'Untitled')}</div>
        ${meta ? `<div class="m">${esc(meta)}</div>` : ''}</div>
      <div class="muted" style="white-space:nowrap;">${esc(when ? timeAgo(when) : '')}</div>
    </div></li>`;
  }).join('')}</ul>`;
}

async function load() {
  panel.innerHTML = '<p class="spinner">Loading...</p>';
  try { data = await api('/api/marketing'); renderTabs(); renderPanel(); }
  catch (err) { tabsEl.innerHTML = ''; showError(document.getElementById('err'), err); panel.innerHTML = ''; }
}
document.getElementById('refresh').addEventListener('click', load);
await load();
</script>
</body></html>
